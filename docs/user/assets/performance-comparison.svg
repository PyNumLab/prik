<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 702" role="img" aria-labelledby="title description">
  <title id="title">x2py performance relative to f2py</title>
  <desc id="description">
    Relative speed across 13 benchmarks. Values above one indicate x2py is faster. x2py is faster in 8 benchmarks.
  </desc>
  <rect x="1" y="1" width="998" height="700" rx="16" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#17212b">
    <text x="28" y="42" font-size="24" font-weight="700">x2py relative performance</text>
    <text x="28" y="70" font-size="14" fill="#52616f">f2py time ÷ x2py time · farther right means faster x2py calls</text>
    <g stroke="#e4eaef" stroke-width="1">
      <line x1="350.0" y1="115" x2="350.0" y2="626"/>
      <line x1="512.9" y1="115" x2="512.9" y2="626"/>
      <line x1="675.7" y1="115" x2="675.7" y2="626"/>
      <line x1="838.6" y1="115" x2="838.6" y2="626"/>
      <line x1="920.0" y1="115" x2="920.0" y2="626"/>
    </g>
    <line x1="512.9" y1="110" x2="512.9" y2="626" stroke="#52616f" stroke-width="2"/>
    <g font-size="12" fill="#607080" text-anchor="middle">
      <text x="350.0" y="103">0.8×</text>
      <text x="512.9" y="103">1.0×</text>
      <text x="675.7" y="103">1.2×</text>
      <text x="838.6" y="103">1.4×</text>
      <text x="920.0" y="103">1.5×</text>
      <text x="512.9" y="85" font-weight="700" fill="#344453">1.0× equal</text>
    </g>
    <g font-size="14">
      <text x="28" y="155">Empty call</text>
      <line x1="512.9" y1="150" x2="567.8" y2="150" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="567.8" cy="150" r="7" fill="#0f766e"/>
      <text x="581.8" y="155" fill="#0f766e" font-weight="700" text-anchor="start">1.07×</text>
      <text x="28" y="193">Add scalars</text>
      <line x1="478.4" y1="188" x2="512.9" y2="188" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="478.4" cy="188" r="7" fill="#b45309"/>
      <text x="464.4" y="193" fill="#b45309" font-weight="700" text-anchor="end">0.96×</text>
      <text x="28" y="231">Increment vector · n=1</text>
      <line x1="512.9" y1="226" x2="821.9" y2="226" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="821.9" cy="226" r="7" fill="#0f766e"/>
      <text x="835.9" y="231" fill="#0f766e" font-weight="700" text-anchor="start">1.38×</text>
      <text x="28" y="269">Increment vector · n=16</text>
      <line x1="512.9" y1="264" x2="784.4" y2="264" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="784.4" cy="264" r="7" fill="#0f766e"/>
      <text x="798.4" y="269" fill="#0f766e" font-weight="700" text-anchor="start">1.33×</text>
      <text x="28" y="307">Increment vector · n=1,024</text>
      <line x1="454.7" y1="302" x2="512.9" y2="302" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="454.7" cy="302" r="7" fill="#b45309"/>
      <text x="440.7" y="307" fill="#b45309" font-weight="700" text-anchor="end">0.93×</text>
      <text x="28" y="345">Increment vector · n=1,000,000</text>
      <line x1="512.9" y1="340" x2="519.5" y2="340" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="519.5" cy="340" r="7" fill="#64748b"/>
      <text x="533.5" y="345" fill="#64748b" font-weight="700" text-anchor="start">1.008×</text>
      <text x="28" y="383">Sum matrix · 4×4</text>
      <line x1="512.9" y1="378" x2="609.0" y2="378" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="609.0" cy="378" r="7" fill="#0f766e"/>
      <text x="623.0" y="383" fill="#0f766e" font-weight="700" text-anchor="start">1.12×</text>
      <text x="28" y="421">Sum matrix · 32×32</text>
      <line x1="512.9" y1="416" x2="526.4" y2="416" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="526.4" cy="416" r="7" fill="#0f766e"/>
      <text x="540.4" y="421" fill="#0f766e" font-weight="700" text-anchor="start">1.02×</text>
      <text x="28" y="459">Sum matrix · 256×256</text>
      <line x1="512.9" y1="454" x2="515.5" y2="454" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="515.5" cy="454" r="7" fill="#0f766e"/>
      <text x="529.5" y="459" fill="#0f766e" font-weight="700" text-anchor="start">1.003×</text>
      <text x="28" y="497">Sum matrix · 1,024×1,024</text>
      <line x1="512.9" y1="492" x2="512.9" y2="492" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="512.9" cy="492" r="7" fill="#64748b"/>
      <text x="526.9" y="497" fill="#64748b" font-weight="700" text-anchor="start">1.000×</text>
      <text x="28" y="535">Update matrix · 4×4</text>
      <line x1="512.9" y1="530" x2="539.1" y2="530" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="539.1" cy="530" r="7" fill="#0f766e"/>
      <text x="553.1" y="535" fill="#0f766e" font-weight="700" text-anchor="start">1.03×</text>
      <text x="28" y="573">Update matrix · 256×256</text>
      <line x1="512.9" y1="568" x2="517.5" y2="568" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="517.5" cy="568" r="7" fill="#0f766e"/>
      <text x="531.5" y="573" fill="#0f766e" font-weight="700" text-anchor="start">1.006×</text>
      <text x="28" y="611">Update matrix · 1,024×1,024</text>
      <line x1="512.9" y1="606" x2="516.9" y2="606" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="516.9" cy="606" r="7" fill="#64748b"/>
      <text x="530.9" y="611" fill="#64748b" font-weight="700" text-anchor="start">1.005×</text>
    </g>
    <g font-size="13">
      <circle cx="30" cy="664" r="6" fill="#0f766e"/>
      <text x="43" y="669" fill="#52616f">x2py faster</text>
      <circle cx="160" cy="664" r="6" fill="#b45309"/>
      <text x="173" y="669" fill="#52616f">f2py faster</text>
      <circle cx="285" cy="664" r="6" fill="#64748b"/>
      <text x="298" y="669" fill="#52616f">no significant difference</text>
      <text x="970" y="669" text-anchor="end" fill="#52616f">Geometric mean: x2py 1.06× faster</text>
    </g>
  </g>
</svg>
