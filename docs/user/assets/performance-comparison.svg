<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
  <title id="title">x2py performance relative to f2py</title>
  <desc id="description">
    Relative speed across thirteen benchmarks. Values above one indicate x2py is faster. x2py is faster in eleven
    benchmarks, with a geometric-mean speedup of 1.13 times.
  </desc>
  <rect x="1" y="1" width="998" height="698" rx="16" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#17212b">
    <text x="28" y="42" font-size="24" font-weight="700">x2py relative performance</text>
    <text x="28" y="70" font-size="14" fill="#52616f">f2py time ÷ x2py time · farther right means faster x2py calls</text>

    <g stroke="#e4eaef" stroke-width="1">
      <line x1="295" y1="108" x2="295" y2="630"/>
      <line x1="520" y1="108" x2="520" y2="630"/>
      <line x1="670" y1="108" x2="670" y2="630"/>
      <line x1="820" y1="108" x2="820" y2="630"/>
      <line x1="895" y1="108" x2="895" y2="630"/>
    </g>
    <line x1="370" y1="103" x2="370" y2="630" stroke="#52616f" stroke-width="2"/>

    <g font-size="12" fill="#607080" text-anchor="middle">
      <text x="295" y="98">0.9×</text>
      <text x="370" y="98" font-weight="700" fill="#344453">1.0× equal</text>
      <text x="520" y="98">1.2×</text>
      <text x="670" y="98">1.4×</text>
      <text x="820" y="98">1.6×</text>
      <text x="895" y="98">1.7×</text>
    </g>

    <g font-size="14">
      <text x="28" y="164">Empty call</text>
      <line x1="370" y1="160" x2="386" y2="160" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="386" cy="160" r="7" fill="#0f766e"/>
      <text x="400" y="165" fill="#0f766e" font-weight="700">1.02×</text>

      <text x="28" y="198">Add scalars</text>
      <line x1="347" y1="194" x2="370" y2="194" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="347" cy="194" r="7" fill="#b45309"/>
      <text x="333" y="199" fill="#b45309" font-weight="700" text-anchor="end">0.97×</text>

      <text x="28" y="246">Increment vector · n=1</text>
      <line x1="370" y1="242" x2="669" y2="242" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="669" cy="242" r="7" fill="#0f766e"/>
      <text x="683" y="247" fill="#0f766e" font-weight="700">1.40×</text>

      <text x="28" y="280">Increment vector · n=16</text>
      <line x1="370" y1="276" x2="651" y2="276" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="651" cy="276" r="7" fill="#0f766e"/>
      <text x="665" y="281" fill="#0f766e" font-weight="700">1.37×</text>

      <text x="28" y="314">Increment vector · n=1,024</text>
      <line x1="370" y1="310" x2="855" y2="310" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="855" cy="310" r="7" fill="#0f766e"/>
      <text x="869" y="315" fill="#0f766e" font-weight="700">1.65×</text>

      <text x="28" y="348">Increment vector · n=1,000,000</text>
      <line x1="326" y1="344" x2="370" y2="344" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="326" cy="344" r="7" fill="#b45309"/>
      <text x="312" y="349" fill="#b45309" font-weight="700" text-anchor="end">0.94×</text>

      <text x="28" y="396">Sum matrix · 4×4</text>
      <line x1="370" y1="392" x2="477" y2="392" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="477" cy="392" r="7" fill="#0f766e"/>
      <text x="491" y="397" fill="#0f766e" font-weight="700">1.14×</text>

      <text x="28" y="430">Sum matrix · 32×32</text>
      <line x1="370" y1="426" x2="399" y2="426" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="399" cy="426" r="7" fill="#0f766e"/>
      <text x="413" y="431" fill="#0f766e" font-weight="700">1.04×</text>

      <text x="28" y="464">Sum matrix · 256×256</text>
      <line x1="370" y1="460" x2="385" y2="460" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="385" cy="460" r="7" fill="#0f766e"/>
      <text x="399" y="465" fill="#0f766e" font-weight="700">1.02×</text>

      <text x="28" y="498">Sum matrix · 1,024×1,024</text>
      <line x1="370" y1="494" x2="476" y2="494" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="476" cy="494" r="7" fill="#0f766e"/>
      <text x="490" y="499" fill="#0f766e" font-weight="700">1.14×</text>

      <text x="28" y="546">Update matrix · 4×4</text>
      <line x1="370" y1="542" x2="445" y2="542" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="445" cy="542" r="7" fill="#0f766e"/>
      <text x="459" y="547" fill="#0f766e" font-weight="700">1.10×</text>

      <text x="28" y="580">Update matrix · 256×256</text>
      <line x1="370" y1="576" x2="388" y2="576" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="388" cy="576" r="7" fill="#0f766e"/>
      <text x="402" y="581" fill="#0f766e" font-weight="700">1.02×</text>

      <text x="28" y="614">Update matrix · 1,024×1,024</text>
      <line x1="370" y1="610" x2="462" y2="610" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="462" cy="610" r="7" fill="#0f766e"/>
      <text x="476" y="615" fill="#0f766e" font-weight="700">1.12×</text>
    </g>

    <g font-size="13">
      <circle cx="30" cy="663" r="6" fill="#0f766e"/>
      <text x="43" y="668" fill="#52616f">x2py faster</text>
      <circle cx="160" cy="663" r="6" fill="#b45309"/>
      <text x="173" y="668" fill="#52616f">f2py faster</text>
      <text x="970" y="668" text-anchor="end" fill="#52616f">Geometric mean: x2py 1.13× faster</text>
    </g>
  </g>
</svg>
