<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 702" role="img" aria-labelledby="title description">
  <title id="title">x2py performance relative to f2py</title>
  <desc id="description">
    Relative speed across 13 benchmarks. Values above one indicate x2py is faster. x2py is faster in 10 benchmarks.
  </desc>
  <rect x="1" y="1" width="998" height="700" rx="16" fill="#ffffff" stroke="#d8e1e8" stroke-width="2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#17212b">
    <text x="28" y="42" font-size="24" font-weight="700">x2py relative performance</text>
    <text x="28" y="70" font-size="14" fill="#52616f">f2py time ÷ x2py time · farther right means faster x2py calls</text>
    <g stroke="#e4eaef" stroke-width="1">
      <line x1="350.0" y1="115" x2="350.0" y2="626"/>
      <line x1="431.4" y1="115" x2="431.4" y2="626"/>
      <line x1="594.3" y1="115" x2="594.3" y2="626"/>
      <line x1="757.1" y1="115" x2="757.1" y2="626"/>
      <line x1="920.0" y1="115" x2="920.0" y2="626"/>
    </g>
    <line x1="431.4" y1="110" x2="431.4" y2="626" stroke="#52616f" stroke-width="2"/>
    <g font-size="12" fill="#607080" text-anchor="middle">
      <text x="350.0" y="103">0.9×</text>
      <text x="431.4" y="103">1.0×</text>
      <text x="594.3" y="103">1.2×</text>
      <text x="757.1" y="103">1.4×</text>
      <text x="920.0" y="103">1.6×</text>
      <text x="431.4" y="85" font-weight="700" fill="#344453">1.0× equal</text>
    </g>
    <g font-size="14">
      <text x="28" y="155">Empty call</text>
      <line x1="431.4" y1="150" x2="498.8" y2="150" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="498.8" cy="150" r="7" fill="#0f766e"/>
      <text x="512.8" y="155" fill="#0f766e" font-weight="700" text-anchor="start">1.08×</text>
      <text x="28" y="193">Add scalars</text>
      <line x1="431.4" y1="188" x2="450.8" y2="188" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="450.8" cy="188" r="7" fill="#0f766e"/>
      <text x="464.8" y="193" fill="#0f766e" font-weight="700" text-anchor="start">1.02×</text>
      <text x="28" y="231">Increment vector · n=1</text>
      <line x1="431.4" y1="226" x2="833.3" y2="226" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="833.3" cy="226" r="7" fill="#0f766e"/>
      <text x="847.3" y="231" fill="#0f766e" font-weight="700" text-anchor="start">1.49×</text>
      <text x="28" y="269">Increment vector · n=16</text>
      <line x1="431.4" y1="264" x2="764.7" y2="264" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="764.7" cy="264" r="7" fill="#0f766e"/>
      <text x="778.7" y="269" fill="#0f766e" font-weight="700" text-anchor="start">1.41×</text>
      <text x="28" y="307">Increment vector · n=1,024</text>
      <line x1="381.6" y1="302" x2="431.4" y2="302" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="381.6" cy="302" r="7" fill="#b45309"/>
      <text x="367.6" y="307" fill="#b45309" font-weight="700" text-anchor="end">0.94×</text>
      <text x="28" y="345">Increment vector · n=1,000,000</text>
      <line x1="431.4" y1="340" x2="509.2" y2="340" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="509.2" cy="340" r="7" fill="#0f766e"/>
      <text x="523.2" y="345" fill="#0f766e" font-weight="700" text-anchor="start">1.10×</text>
      <text x="28" y="383">Sum matrix · 4×4</text>
      <line x1="431.4" y1="378" x2="463.2" y2="378" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="463.2" cy="378" r="7" fill="#0f766e"/>
      <text x="477.2" y="383" fill="#0f766e" font-weight="700" text-anchor="start">1.04×</text>
      <text x="28" y="421">Sum matrix · 32×32</text>
      <line x1="425.2" y1="416" x2="431.4" y2="416" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="425.2" cy="416" r="7" fill="#b45309"/>
      <text x="411.2" y="421" fill="#b45309" font-weight="700" text-anchor="end">0.992×</text>
      <text x="28" y="459">Sum matrix · 256×256</text>
      <line x1="408.9" y1="454" x2="431.4" y2="454" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <circle cx="408.9" cy="454" r="7" fill="#b45309"/>
      <text x="394.9" y="459" fill="#b45309" font-weight="700" text-anchor="end">0.97×</text>
      <text x="28" y="497">Sum matrix · 1,024×1,024</text>
      <line x1="431.4" y1="492" x2="451.6" y2="492" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="451.6" cy="492" r="7" fill="#0f766e"/>
      <text x="465.6" y="497" fill="#0f766e" font-weight="700" text-anchor="start">1.02×</text>
      <text x="28" y="535">Update matrix · 4×4</text>
      <line x1="431.4" y1="530" x2="463.5" y2="530" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="463.5" cy="530" r="7" fill="#0f766e"/>
      <text x="477.5" y="535" fill="#0f766e" font-weight="700" text-anchor="start">1.04×</text>
      <text x="28" y="573">Update matrix · 256×256</text>
      <line x1="431.4" y1="568" x2="438.6" y2="568" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="438.6" cy="568" r="7" fill="#0f766e"/>
      <text x="452.6" y="573" fill="#0f766e" font-weight="700" text-anchor="start">1.009×</text>
      <text x="28" y="611">Update matrix · 1,024×1,024</text>
      <line x1="431.4" y1="606" x2="600.7" y2="606" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="600.7" cy="606" r="7" fill="#0f766e"/>
      <text x="614.7" y="611" fill="#0f766e" font-weight="700" text-anchor="start">1.21×</text>
    </g>
    <g font-size="13">
      <circle cx="30" cy="664" r="6" fill="#0f766e"/>
      <text x="43" y="669" fill="#52616f">x2py faster</text>
      <circle cx="160" cy="664" r="6" fill="#b45309"/>
      <text x="173" y="669" fill="#52616f">f2py faster</text>
      <circle cx="285" cy="664" r="6" fill="#64748b"/>
      <text x="298" y="669" fill="#52616f">no significant difference</text>
      <text x="970" y="669" text-anchor="end" fill="#52616f">Geometric mean: x2py 1.09× faster</text>
    </g>
  </g>
</svg>
