site_name: PRIK — Bring Native Code to Python
site_description: PRIK generates native Python bindings from Fortran projects, producing importable extensions and editable .pyi contracts for Pythonic APIs.
site_url: https://pynumlab.github.io/prik/
repo_url: https://github.com/PyNumLab/prik
repo_name: GitHub
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: .artifacts/site
theme:
  name: readthedocs
  custom_dir: docs_theme
  logo: user/assets/prik-mark.png
  collapse_navigation: false
  include_homepage_in_sidebar: true
  navigation_depth: 4
  sticky_navigation: true
  titles_only: false
extra_css:
  - stylesheets/site.css
  - stylesheets/code-copy.css
extra_javascript:
  - javascripts/code-copy.js
  - javascripts/example-tabs.js
  - javascripts/faq.js
  - javascripts/term-tooltips.js
plugins:
  - search
hooks:
  - tools/mkdocs_publication.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
exclude_docs: |
  old_docs/**
